<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay Focus Guard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Overlay Focus Guard</h1>
      <p id="origin" class="origin">Loading...</p>

    </main>
    <script src="popup.js"></script>
  </body>
